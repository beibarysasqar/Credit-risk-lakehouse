name: Deploy to prod

on:
  push:
    branches: [main]

# Deploys run one after another; a running deploy is never cancelled half-way.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The bundle builds the wheel with `uv build`.
      # setup-uv has no floating major tags since v8: the full version is pinned.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - uses: databricks/setup-cli@main

      - name: Bundle validate
        run: databricks bundle validate -t prod

      # Deploys the pipeline and job definitions only; nothing is run.
      - name: Bundle deploy
        run: databricks bundle deploy -t prod
