[project]
name = "credit-risk"
version = "0.1.0"
description = "Medallion lakehouse on Home Credit Default Risk and ECB macro data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Keep both on the Spark major/minor of the Databricks serverless environment.
    "pyspark==4.0.*",
    "delta-spark==4.0.*",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
